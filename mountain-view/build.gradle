import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.commons.ClassRemapper
import org.objectweb.asm.commons.Remapper
import java.util.jar.JarOutputStream
import java.util.jar.JarEntry
import java.util.zip.ZipFile

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-commons:9.7.1' }
}
plugins { id 'com.android.library' }
android {
    namespace 'com.peaknav'
    compileSdk 36
    defaultConfig { minSdk 24 }
    sourceSets.main {
        java.srcDirs = ['src/main/java', 'src/main/core/java']
        resources.srcDirs = ['src/main/core/resources']
        jniLibs.srcDirs = [layout.buildDirectory.dir('natives')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        resValue 'string', 'mv_app_name', 'Mountain View'
        resValue 'drawable', 'mv_ic_launcher_app', '@drawable/mv_mountain_icon'
    }
}
configurations { mountainNatives; mountainPbf { transitive = false } }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
    api 'com.badlogicgames.gdx:gdx:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.14.2'
    implementation 'com.badlogicgames.gdx:gdx-box2d:1.14.2'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.apache.lucene:lucene-core:3.6.2'
    implementation 'org.apache.lucene:lucene-analyzers:3.6.2'
    implementation 'org.apache.lucene:lucene-queryparser:3.6.2'
    implementation 'com.alexdupre:pngj:2.1.2.1'
    mountainPbf 'org.openstreetmap.pbf:osmpbf:1.6.1'
    mountainPbf 'com.google.protobuf:protobuf-java:4.33.2'
    implementation files(layout.buildDirectory.file('isolated-pbf/mountain-pbf.jar')).builtBy('isolateMountainPbf')
    ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
        ['gdx-platform', 'gdx-freetype-platform', 'gdx-box2d-platform'].each { lib ->
            mountainNatives "com.badlogicgames.gdx:${lib}:1.14.2:natives-${abi}"
        }
    }
}
tasks.register('extractMountainNatives') {
    inputs.files(configurations.mountainNatives)
    outputs.dir(layout.buildDirectory.dir('natives'))
    doLast {
        configurations.mountainNatives.files.each { jar ->
            def abi = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'].find { jar.name.endsWith("natives-${it}.jar") }
            copy {
                from zipTree(jar)
                include '*.so'
                into layout.buildDirectory.dir("natives/${abi}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'extractMountainNatives' }

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }

// OsmAnd ships a patched legacy Protobuf. Keep the current OSM parser/runtime together,
// without replacing the host runtime used to read OBF files.
class MountainPbfRemapper extends Remapper {
    @Override String map(String name) {
        if (name.startsWith('com/google/protobuf/')) return 'com/peaknav/shaded/protobuf/' + name.substring('com/google/protobuf/'.length())
        if (name.startsWith('crosby/binary/')) return 'com/peaknav/shaded/osmpbf/' + name.substring('crosby/binary/'.length())
        return name
    }
}
tasks.register('isolateMountainPbf') {
    inputs.files(configurations.mountainPbf)
    inputs.file('build.gradle')
    def output = layout.buildDirectory.file('isolated-pbf/mountain-pbf.jar')
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        def remapper = new MountainPbfRemapper()
        new JarOutputStream(new FileOutputStream(target)).withCloseable { out ->
            configurations.mountainPbf.files.sort { it.name }.each { source ->
                new ZipFile(source).withCloseable { zip ->
                    zip.entries().toList().sort { it.name }.each { entry ->
                        if (!entry.directory && entry.name.endsWith('.class') && !entry.name.startsWith('META-INF/') && entry.name != 'module-info.class') {
                            def writer = new ClassWriter(0)
                            zip.getInputStream(entry).withCloseable { stream ->
                                new ClassReader(stream).accept(new ClassRemapper(writer, remapper), 0)
                            }
                            def rewritten = new JarEntry(remapper.map(entry.name.substring(0, entry.name.length() - 6)) + '.class')
                            rewritten.time = 0
                            out.putNextEntry(rewritten)
                            out.write(writer.toByteArray())
                            out.closeEntry()
                        }
                    }
                }
            }
        }
    }
}

// Only the host runtime classes are needed for the coexistence regression test.
tasks.register('hostProtobufTestRuntime', Jar) {
    dependsOn ':OsmAnd-java:compileJava'
    from(project(':OsmAnd-java').layout.buildDirectory.dir('classes/java/main'))
    include 'com/google/protobuf/**'
    archiveFileName = 'host-protobuf-test.jar'
    destinationDirectory = layout.buildDirectory.dir('test-runtime')
}
dependencies {
    testRuntimeOnly files(tasks.named('hostProtobufTestRuntime').flatMap { it.archiveFile })
}
